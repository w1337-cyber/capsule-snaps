<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Capsule</title>
<meta name="description" content="Snaps that open later. Shoot all year with your friends; open it together.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Capsule">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="phone" id="phone">

  <div id="pager"><div id="track">
  <!-- CHAT -->
  <section class="screen light-screen" id="s-chat" aria-label="Chat">
    <div class="head">
      <div class="l"><button class="me" id="meav2" aria-label="You" style="width:38px;height:38px">?</button><button class="ib" id="chatsearchbtn" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button></div>
      <h1>Chat</h1>
      <div class="r"><button class="ib" id="newchat" aria-label="New chat"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.1A8 8 0 1 1 20 12z"/><path d="M12 9v6M9 12h6"/></svg></button></div>
    </div>
    <div class="search hidden" id="chatsearch"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="chatq" placeholder="Search groups" aria-label="Search groups"></div>
    <div class="scroll" id="chatlist"></div>
  </section>

  <!-- CAMERA (home) -->
  <section class="screen cam" id="s-camera" aria-label="Camera">
    <video id="viewfinder" autoplay playsinline muted></video>
    <div class="perm hidden" id="camperm">
      <h2>Turn on your camera</h2>
      <p id="campermmsg">So you can snap moments for your groups.</p>
      <button class="pillbtn" id="campermretry">Try again</button>
      <button class="pillbtn ghost" id="campermlib" style="background:rgba(255,255,255,.14);color:#fff">Send from my photos</button>
    </div>
    <div class="cam-top">
      <div class="cam-left">
        <button class="me" id="meav" aria-label="You">?</button>
        <button class="glass" id="camsearch" aria-label="Find a group"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      </div>
      <div class="rail">
        <button id="camflip" aria-label="Flip camera"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a8 8 0 0 1 14-3l2 2"/><path d="M20 4v4h-4"/><path d="M20 15a8 8 0 0 1-14 3l-2-2"/><path d="M4 20v-4h4"/></svg></button>
        <button id="camflash" class="hidden" aria-label="Flash"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></button>
        <button id="camgal" aria-label="Pick from your photos"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 9"/></svg></button>
      </div>
    </div>
    <div class="recpill hidden" id="recpill"><i></i><span id="recsec">0s</span></div>
    <div class="cam-mid"></div>
    <div class="hint-tip" id="camtip">Tap for photo · hold for video</div>
    <div class="cam-bottom">
      <button class="cam-side" id="camgal2" aria-label="Pick from your photos"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="6" y="3" width="13" height="16" rx="2.5"/><path d="M4 7v11a3 3 0 0 0 3 3h9"/></svg></button>
      <div class="shutwrap">
        <button class="shutter" id="shutter" aria-label="Take a snap. Hold to record video."></button>
        <svg class="ring" viewBox="0 0 86 86" aria-hidden="true"><circle id="ringc" cx="43" cy="43" r="40"/></svg>
      </div>
      <span class="cam-side" aria-hidden="true"></span>
    </div>
  </section>

  <!-- MEMORIES -->
  <section class="screen light-screen" id="s-memories" aria-label="Memories">
    <div class="head"><div class="l"></div><h1>Memories</h1><div class="r"></div></div>
    <div class="scroll" id="memlist"></div>
  </section>

  </div></div>

  <!-- THREAD -->
  <section class="screen light-screen thread" id="s-thread" aria-label="Group chat"></section>

  <nav class="nav" id="nav" aria-label="Main">
    <button data-tab="chat" aria-label="Chat"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.1A8 8 0 1 1 20 12z"/></svg><span class="dot hidden" id="navdot"></span></button>
    <button data-tab="camera" aria-label="Camera" aria-current="page"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h2l1.5-2h6l1.5 2h2A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="12.5" r="3.6"/></svg></button>
    <button data-tab="memories" aria-label="Memories"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></button>
  </nav>
</div>

<input type="file" id="pickLib" accept="image/*,video/*" multiple hidden>
<script type="module" src="app.js"></script>
</body>
</html>
