# Netlify: serve the installable web app straight from web-pwa/ (no build step).
[build]
  publish = "web-pwa"
  command = "echo 'static site, no build'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(self)"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "script-src 'self' https://cdn.jsdelivr.net; frame-src 'none'; object-src 'none'; base-uri 'self'; worker-src 'self' blob:"
